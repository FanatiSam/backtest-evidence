[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-evidence"
version = "0.1.1"
description = "Small, dependency-free checks for auditable backtest evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sam Chen"}]
dependencies = []

[project.scripts]
backtest-evidence = "backtest_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["backtest_evidence*"]
