name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m backtest_evidence report examples/daily_pnl.csv --capital 1000 --sessions examples/sessions.csv
      - run: python -m backtest_evidence events examples/events.csv
